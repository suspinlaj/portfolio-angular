<header>
    <div>
        <!-- Si el tema es claro muestra ⏾, si no ☀︎ -->
        <button type="button" (click)="dataService.toggleTema()">
            {{ dataService.temaClaro() ? '⏾' : '☀︎' }}
        </button>
        
        <!-- Si el idioma actual es ES muestra EN para cambiar, y viceversa -->
        <button type="button" (click)="cambiarIdioma()">
            {{ dataService.idiomaActual() === 'es' ? 'EN' : 'ES' }}
        </button>
    </div>

    <!-- Foto de perfil -->
    <figure>
        <img src="assets/images/fotocv.jpg" alt="Foto CV Susana Pineros">
    </figure>

    <h1 [innerHTML]="getTexto('header-titulo')"></h1>
    <p [innerHTML]="getTexto('header-desc')"></p>

    <!-- Navegación -->
    <nav>
        <a href="#proyectos">{{ getTexto('nav-proyectos') }}</a>
        <a href="#skills">{{ getTexto('nav-skills') }}</a>
        <a href="#sobremi">{{ getTexto('nav-sobremi') }}</a>
        <a href="#contacto">{{ getTexto('nav-contacto') }}</a>
    </nav>
</header>
