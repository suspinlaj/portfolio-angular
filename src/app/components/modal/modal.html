<!-- Solo se renderiza si el modal está abierto -->
@if (dataService.modalAbierto()) {
    <div id="modal-proyecto" class="modal-activa" (click)="dataService.cerrarModal()">
        <!-- El stopPropagation evita que al hacer clic dentro del vídeo se cierre el modal -->
        <div class="modal-contenido" (click)="$event.stopPropagation()">
            <button id="cerrar-modal" aria-label="Cerrar ventana" (click)="dataService.cerrarModal()">✖</button>
            <div id="modal-cuerpo">
                <video [src]="dataService.videoActual()" controls autoplay></video>
            </div>
        </div>
    </div>
}
